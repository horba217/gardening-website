<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="plantseeds.css">
    <title>Document</title>
</head>
<body>

   <header class="trigger-header">
    <a href="plantsgrow.html"> <h1>Plant Seeds</h1></a>
    </header>

    <div class="image-container" class="soil">
         <img src="soil.jpg" alt="dirt" class="soil" class="image-container img" class="bleed-image">
    </div>

  <div class="animation-container">
        <!-- Change the src to your specific image seed URL -->
        <img src="seed.png" class="falling-img" style="--left-pos: 5%; --delay: 0s;">
        <img src="seed.png" class="falling-img" style="--left-pos: 20%; --delay: 0.5s;">
        <img src="seed.png" class="falling-img" style="--left-pos: 40%; --delay: 1.2s;">
        <img src="seed.png" class="falling-img" style="--left-pos: 60%; --delay: 0.2s;">
        <img src="seed.png" class="falling-img" style="--left-pos: 75%; --delay: 1.8s;">
        <img src="seed.png" class="falling-img" style="--left-pos: 90%; --delay: 0.9s;">
    </div>

</body>
</html>
